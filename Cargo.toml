[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# OpenDataSuite crates (and rs-rich) require 1.90.
rust-version = "1.90"
publish = false
license = "Apache-2.0"
repository = "https://github.com/buchochelliq-labs/open-data-suite-ontology"

[workspace.dependencies]
onto-core = { path = "crates/onto-core", version = "0.1.1" }
onto-store = { path = "crates/onto-store", version = "0.1.1" }
onto-workspace = { path = "crates/onto-workspace", version = "0.1.1" }
onto-ods = { path = "crates/onto-ods", version = "0.1.1" }

# OpenDataSuite: the ontology consumes its typed outputs rather than re-deriving them.
# ods-erd is the one ODS crate on crates.io (ODS ADR-0032); crates.io serves `version`
# when onto is published. Until ODS releases it, builds use ODS main at this commit,
# whose ods-erd is 0.1.0. Once 0.1.x is on crates.io, drop `git` and `rev`.
ods-erd = { git = "https://github.com/buchochelliq-labs/open-data-suite", rev = "8936e48fa3570cf8606bc0184e9aa4c45a0bafc0", version = "0.1" }
onto-mcp = { path = "crates/onto-mcp", version = "0.1.1" }
onto-testkit = { path = "crates/onto-testkit" }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.60", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8", features = ["server", "client", "macros", "transport-io", "transport-child-process", "schemars"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
toml = "1.1"
