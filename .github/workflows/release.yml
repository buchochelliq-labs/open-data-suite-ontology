name: release

# Prebuilt `onto` binaries for Linux, macOS and Windows, released with the
# buchochelliq-labs standard (https://github.com/buchochelliq-labs/release-kit).
#
# On main, after the release PR merges: `python3 ../release-kit/scripts/release.py tag`.
# It pushes the annotated tags v<version> (the GitHub release's tag, a record)
# and release-<version>, which starts this run: the gate checks the tag once,
# CI reruns on the tagged commit, the binaries are built from it, and the
# archives and their SHA-256 are attached to the release, then downloaded
# again and checked. A failed run is finished by running `release.py tag`
# again. Dispatching an existing release tag reruns it.

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (release-X.Y.Z) to run again
        required: true

permissions:
  contents: read

concurrency:
  # One release at a time; never cancel one that may be half published.
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      release: ${{ steps.gate.outputs.release }}
      selection: ${{ steps.gate.outputs.selection }}
      github: ${{ steps.gate.outputs.github }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: gate
        uses: buchochelliq-labs/release-kit/gate@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}

  # CI on the tagged commit (it reads the repository: the workflow's contents: read).
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  build:
    needs: [gate, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          # Intel macOS is cross-compiled on Apple Silicon: GitHub retired
          # the macos-13 Intel runners in December 2025.
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p onto-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.release }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="onto-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          bin="target/$TARGET/release/onto"
          [ "$ARCHIVE" = zip ] && bin="$bin.exe"
          cp "$bin" README.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            7z a -bd "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: onto-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The only job that can write: it creates the release on v<version> and
  # attaches the archives the build jobs produced.
  publish-github:
    needs: [gate, build]
    if: needs.gate.outputs.github == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: buchochelliq-labs/release-kit/publish-github@v1
        with:
          selection: ${{ needs.gate.outputs.selection }}
          files: dist/*
