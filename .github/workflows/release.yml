name: release

# Prebuilt `onto` binaries for Linux, macOS and Windows, released with the
# buchochelliq-labs standard (https://github.com/buchochelliq-labs/release-kit).
#
# What is built and published is declared in release-kit.yml. On main, after
# the release PR merges: `python3 ../release-kit/scripts/release.py tag`. It
# pushes the annotated tags v<version> (the GitHub release's tag, a record)
# and release-<version>, which starts this run: the gate checks the tag once,
# CI reruns on the tagged commit, release-kit builds the declared artifacts
# from it, and the archives and their SHA-256 are attached to the release,
# then downloaded again and checked. A failed run is finished by running `release.py tag`
# again. Dispatching an existing release tag reruns it.

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (release-X.Y.Z) to run again
        required: true

permissions:
  contents: read

concurrency:
  # One release at a time; never cancel one that may be half published.
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      release: ${{ steps.gate.outputs.release }}
      selection: ${{ steps.gate.outputs.selection }}
      github: ${{ steps.gate.outputs.github }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: gate
        uses: buchochelliq-labs/release-kit/gate@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}

  # CI on the tagged commit (it reads the repository: the workflow's contents: read).
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  # Builds what release-kit.yml declares (onto for five targets) from the
  # tagged commit.
  build:
    needs: [gate, ci]
    uses: buchochelliq-labs/release-kit/.github/workflows/build.yml@v1
    with:
      sha: ${{ needs.gate.outputs.sha }}
      selection: ${{ needs.gate.outputs.selection }}

  # The only job that can write: it creates the release on v<version> and
  # attaches the archives the build jobs produced.
  publish-github:
    needs: [gate, build]
    if: needs.gate.outputs.github == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release--*
          path: dist
      - uses: buchochelliq-labs/release-kit/publish-github@v1
        with:
          selection: ${{ needs.gate.outputs.selection }}
