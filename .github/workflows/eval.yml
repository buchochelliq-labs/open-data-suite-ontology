name: Evaluate (does the ontology help?)

# Runs evals/*.yaml under three conditions: OpenDataSuite tools only, ontology
# tools only, and both. Manual.
#
# Default provider: GitHub Models, which is free (rate-limited) and uses this
# workflow's GITHUB_TOKEN, so no secret is needed. For another OpenAI-compatible
# provider choose `custom`, set `base_url`, and add the ONTO_LLM_API_KEY secret.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [github-models, custom]
        default: github-models
      model:
        description: Agent model (GitHub Models ids look like openai/gpt-4.1-mini)
        default: openai/gpt-4.1-mini
      judge_model:
        description: Judge model (defaults to the agent model)
        required: false
      base_url:
        description: For `custom` only. OpenAI-compatible base URL including /v1
        required: false
      runs:
        description: Repetitions per task and condition (free tiers allow few requests a day)
        default: "1"

permissions:
  contents: read
  models: read

env:
  CARGO_TERM_COLOR: always

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opendatasuite==0.0.2

      - name: Run evaluation
        env:
          PROVIDER: ${{ inputs.provider }}
          CUSTOM_BASE_URL: ${{ inputs.base_url }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_API_KEY: ${{ secrets.ONTO_LLM_API_KEY }}
          CUSTOM_JUDGE_API_KEY: ${{ secrets.ONTO_JUDGE_API_KEY }}
          ONTO_LLM_MODEL: ${{ inputs.model }}
          ONTO_JUDGE_MODEL: ${{ inputs.judge_model }}
          RUNS: ${{ inputs.runs }}
        run: |
          if [ "$PROVIDER" = "github-models" ]; then
            export ONTO_LLM_BASE_URL="https://models.github.ai/inference"
            export ONTO_LLM_API_KEY="$GITHUB_MODELS_TOKEN"
          else
            if [ -z "$CUSTOM_BASE_URL" ]; then echo "::error::base_url is required for the custom provider"; exit 1; fi
            export ONTO_LLM_BASE_URL="$CUSTOM_BASE_URL"
            export ONTO_LLM_API_KEY="$CUSTOM_API_KEY"
            export ONTO_JUDGE_API_KEY="$CUSTOM_JUDGE_API_KEY"
          fi
          cargo run -p onto-testkit --features llm --bin onto-eval -- --runs "$RUNS"

      - name: Summary
        if: always()
        run: cat target/eval/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.run_id }}
          path: target/eval/
