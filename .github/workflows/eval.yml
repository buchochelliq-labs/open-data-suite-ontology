name: Evaluate (does the ontology help?)

# Runs evals/*.yaml under three conditions: OpenDataSuite tools only, ontology
# tools only, and both. Manual. Any OpenAI-compatible endpoint works; presets
# cover free options (provider rate limits and model lists change, so check
# the provider's current documentation):
#
#   gemini      Google AI Studio free tier. Secret GEMINI_API_KEY (free, no card).
#   groq        Groq free tier. Secret GROQ_API_KEY. Low tokens/minute.
#   openrouter  OpenRouter `:free` models. Secret OPENROUTER_API_KEY. ~50 requests/day.
#   local       llama.cpp on the runner. No key, nothing to retire; slow and weaker.
#   custom      Any endpoint: `base_url` input and secret ONTO_LLM_API_KEY.
#
# Secrets are read from the repository's `ai` environment (Settings →
# Environments → ai), or from repository secrets of the same name.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [gemini, groq, openrouter, local, custom]
        default: gemini
      model:
        description: Agent model (empty = the preset's default)
        required: false
      base_url:
        description: For `custom` only. OpenAI-compatible base URL including /v1
        required: false
      runs:
        description: Repetitions per task and condition (free tiers allow few requests a day)
        default: "1"
      rpm:
        description: Requests per minute to stay under (empty = the preset's default, e.g. 5 for gemini)
        required: false
      task:
        description: Only tasks whose name contains this (empty = all). One task fits a small daily quota
        required: false
      conditions:
        description: Conditions to compare, comma-separated
        default: ods_only,ontology_only,both
      judge:
        description: Score judged criteria with the model (costs extra requests)
        type: boolean
        default: true
      max_requests:
        description: Stop after this many model requests (empty = no cap; the run also stops when a daily quota is reached)
        required: false
      local_model:
        description: For `local`. Hugging Face repository and GGUF file, as repo/file.gguf
        default: bartowski/Qwen2.5-7B-Instruct-GGUF/Qwen2.5-7B-Instruct-Q4_K_M.gguf

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  eval:
    runs-on: ubuntu-latest
    # Provider keys (e.g. GEMINI_API_KEY) are secrets of the `ai` environment,
    # which only jobs that name it can read.
    environment: ai
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opendatasuite==0.0.2

      - name: Cache local model
        if: inputs.provider == 'local'
        uses: actions/cache@v4
        with:
          path: ~/models
          key: gguf-${{ inputs.local_model }}

      - name: Start local model server
        if: inputs.provider == 'local'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_MODEL: ${{ inputs.local_model }}
        run: |
          MODEL_REPO="${LOCAL_MODEL%/*}"
          MODEL_FILE="${LOCAL_MODEL##*/}"
          echo "LOCAL_MODEL_FILE=$MODEL_FILE" >> "$GITHUB_ENV"
          mkdir -p ~/models ~/llama
          if [ ! -f ~/models/"$MODEL_FILE" ]; then
            pip install --quiet "huggingface_hub[cli]"
            huggingface-cli download "$MODEL_REPO" "$MODEL_FILE" --local-dir ~/models
          fi
          (cd ~/llama && gh release download --repo ggml-org/llama.cpp --pattern '*bin-ubuntu-x64.zip' && unzip -q ./*.zip)
          SERVER=$(find ~/llama -name llama-server -type f | head -1)
          nohup "$SERVER" -m ~/models/"$MODEL_FILE" --jinja -c 32768 --port 8080 > ~/llama/server.log 2>&1 &
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:8080/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/health

      - name: Run evaluation
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          CUSTOM_BASE_URL: ${{ inputs.base_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_API_KEY: ${{ secrets.ONTO_LLM_API_KEY }}
          RUNS: ${{ inputs.runs }}
          RPM: ${{ inputs.rpm }}
          TASK: ${{ inputs.task }}
          CONDITIONS: ${{ inputs.conditions }}
          JUDGE: ${{ inputs.judge }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          case "$PROVIDER" in
            gemini)     BASE="https://generativelanguage.googleapis.com/v1beta/openai"; KEY="$GEMINI_API_KEY";     DEFAULT="gemini-flash-latest";      PACE=5 ;;
            groq)       BASE="https://api.groq.com/openai/v1";                          KEY="$GROQ_API_KEY";       DEFAULT="openai/gpt-oss-120b";      PACE=30 ;;
            openrouter) BASE="https://openrouter.ai/api/v1";                            KEY="$OPENROUTER_API_KEY"; DEFAULT="openai/gpt-oss-120b:free"; PACE=20 ;;
            local)      BASE="http://127.0.0.1:8080/v1";                                KEY="";                    DEFAULT="$LOCAL_MODEL_FILE";        PACE="" ;;
            custom)     BASE="$CUSTOM_BASE_URL";                                        KEY="$CUSTOM_API_KEY";     DEFAULT="";                         PACE="" ;;
          esac
          # Pace requests below the provider's per-minute limit instead of hitting it.
          export ONTO_LLM_RPM="${RPM:-$PACE}"
          if [ -z "$BASE" ]; then echo "::error::base_url is required for the custom provider"; exit 1; fi
          if [ "$PROVIDER" != "local" ] && [ -z "$KEY" ]; then
            echo "::error::no API key: add the repository secret for the $PROVIDER provider (see the comment at the top of eval.yml)"; exit 1
          fi
          export ONTO_LLM_BASE_URL="$BASE" ONTO_LLM_API_KEY="$KEY" ONTO_LLM_MODEL="${MODEL:-$DEFAULT}"
          if [ -z "$ONTO_LLM_MODEL" ]; then echo "::error::set the model input"; exit 1; fi
          echo "provider=$PROVIDER model=$ONTO_LLM_MODEL runs=$RUNS requests_per_minute=${ONTO_LLM_RPM:-unlimited}"
          ARGS=(--runs "$RUNS" --conditions "$CONDITIONS")
          if [ -n "$TASK" ]; then ARGS+=(--task "$TASK"); fi
          if [ "$JUDGE" != "true" ]; then ARGS+=(--no-judge); fi
          if [ -n "$MAX_REQUESTS" ]; then ARGS+=(--max-requests "$MAX_REQUESTS"); fi
          cargo run -p onto-testkit --features llm --bin onto-eval -- "${ARGS[@]}"

      - name: Summary
        if: always()
        run: cat target/eval/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.run_id }}
          path: |
            target/eval/
            ~/llama/server.log
