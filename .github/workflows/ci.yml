name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # OpenDataSuite for the onto-ods integration test (pinned like ods-erd).
      - run: pip install opendatasuite==0.0.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Tier 1 (scripted scenarios, replay, asset checks) and the model loop
      # against a fake endpoint. The real-model episode skips without ONTO_LLM_BASE_URL.
      - run: cargo test --workspace --all-features
