name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reruns CI on the tagged commit (release-kit standard).
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Runs Tuva's third-party dbt code in a job without permissions; see the workflow.
  tuva-fixture:
    permissions: {}
    uses: ./.github/workflows/tuva-fixture.yml

  check:
    needs: tuva-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: tuva-manifest
          path: fixtures/tuva/target
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # OpenDataSuite for the onto-ods integration test (pinned like ods-erd).
      - run: pip install opendatasuite==0.0.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Tier 1 (scripted scenarios, replay, asset checks) and the model loop
      # against a fake endpoint. The real-model episode skips without ONTO_LLM_BASE_URL.
      - run: cargo test --workspace --all-features
