# What this repository publishes: the release-kit standard
# (https://github.com/buchochelliq-labs/release-kit). On main, after the
# release PR merges:
#
#   python3 ../release-kit/scripts/release.py check     this file matches the manifests
#   python3 ../release-kit/scripts/release.py tag       tag the release and wait for it
#
# The release tag (release-<version>) starts .github/workflows/release.yml,
# which reruns CI on the tagged commit, builds onto for every platform, and
# attaches the archives to the GitHub release on the package's tag (v<version>).

[[package]]
name = "onto"
registry = "github"
manifest = "crates/onto-cli/Cargo.toml"
version = "0.1.0"
tag = "v{version}"
# What the binary is built from, including the skills and agent it embeds.
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "skills/**", ".github/agents/**"]
