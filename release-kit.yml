# What this repository publishes and how it is built: the buchochelliq-labs
# release standard (https://github.com/buchochelliq-labs/release-kit).
# On main, after the release PR merges:
#
#   python3 .github/release-kit/scripts/release.py check   # this file matches the manifests
#   python3 .github/release-kit/scripts/release.py tag     # tag the release and wait for it
#
# The release tag (release-<version>) starts .github/workflows/release.yml:
# CI on the tagged commit, the artifacts below built from it, and the GitHub
# release on v<version> with every archive and its SHA-256.

packages:
  # The library crates and the CLI on crates.io, each after the crates it depends on
  # (`cargo install onto-cli` installs the `onto` command; the name `onto` is taken).
  - name: onto-core
    registry: crates.io
    manifest: crates/onto-core/Cargo.toml
    version: "0.1.1"
  - name: onto-store
    registry: crates.io
    manifest: crates/onto-store/Cargo.toml
    version: "0.1.1"
  - name: onto-ods
    registry: crates.io
    manifest: crates/onto-ods/Cargo.toml
    version: "0.1.1"
  - name: onto-workspace
    registry: crates.io
    manifest: crates/onto-workspace/Cargo.toml
    version: "0.1.1"
  - name: onto-mcp
    registry: crates.io
    manifest: crates/onto-mcp/Cargo.toml
    version: "0.1.1"
  - name: onto-cli
    registry: crates.io
    manifest: crates/onto-cli/Cargo.toml
    version: "0.1.1"

  # The prebuilt `onto` binaries on GitHub Releases; it names the release.
  - name: onto
    registry: github
    manifest: crates/onto-cli/Cargo.toml
    version: "0.1.1"
    tag: "v{version}"
    # What the binary is built from, including the skills and agent it embeds.
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "skills/**", ".github/agents/**"]
    artifacts:
      # onto-v<version>-<target>.tar.gz (.zip on Windows) for Linux (x86_64,
      # arm64), macOS (arm64, x86_64) and Windows (x86_64): the kit's defaults.
      - kind: rust-binary
        bin: onto
        include: [README.md, LICENSE]
