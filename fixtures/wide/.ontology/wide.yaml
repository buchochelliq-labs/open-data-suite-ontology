# Two keys to the same table on different columns are two relationships.
entities:
  - id: model.wide.payments
    label: payments
    relations:
      - { predicate: references, target: model.wide.customers, qualifiers: { column: payer_id } }
      - { predicate: references, target: model.wide.customers, qualifiers: { column: payee_id } }

  - id: model.wide.customers
    label: customers
    properties:
      grain: one row per customer

