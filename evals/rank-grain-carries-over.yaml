name: rank-grain-carries-over
fixture: jaffle
# The learning loop: a fact told in one session, accepted by a person, is used
# by a later session. Without the ontology nothing can be recorded, so the
# later session cannot know it.
prompt: >-
  For the record, customer_order_rank is one row per customer order, numbered
  within each customer by order date. Can you record that grain for the team?
replies:
  - Yes, please record it.
  - ACCEPT
  - Thanks.
persona:
  role: the analytics engineer who owns customer_order_rank
  goal: get the model's grain recorded so teammates stop asking
  knows:
    - customer_order_rank has one row per customer order, numbered within each customer by order date.
  accepts_proposals: true
criteria:
  - id: proposed_grain
    proposed: { predicate: grain, contains: "customer order" }
followup:
  prompt: What's the grain of customer_order_rank? I'm about to join it to orders.
  replies:
    - Thanks, that helps.
  persona:
    role: analyst joining customer_order_rank to orders
    goal: the grain of customer_order_rank, so the join doesn't double-count
    knows:
      - You have never used this model.
  criteria:
    - id: knows_recorded_grain
      answer_contains_any: ["customer order"]
    - id: cites_record
      judge: >-
        Does the assistant give the grain of customer_order_rank as a recorded, reviewed team
        fact, saying where it comes from, rather than inferring it from columns?
