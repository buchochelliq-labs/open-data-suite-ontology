name: saas-deals-to-mrr
fixture: saas
# Pilot control: the join path is visible in dbt (fct_deals.account_id). Both
# conditions should pass; the ontology must not make this worse.
prompt: How do I put HubSpot deals next to MRR so I can see revenue per company?
replies:
  - Will every HubSpot company match?
persona:
  role: revenue operations analyst
  goal: a query joining deals to MRR per company
  knows:
    - Some HubSpot companies are prospects that have never used the product.
criteria:
  - id: joins_on_account
    answer_contains_any: ["account_id"]
  - id: sound_join
    judge: >-
      Does the assistant join deals to MRR through the product account (fct_deals.account_id to
      fct_mrr.account_id, or through int_account_identity), handle that fct_mrr has one row per
      account per month (by picking a month or aggregating), and say that companies without a
      product account will not match?
