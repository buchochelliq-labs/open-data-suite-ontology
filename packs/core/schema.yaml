# Vocabulary for describing data models. Domain packs extend this.
types:
  - id: BusinessConcept
    label: Business concept
    definition: A thing the business talks about, independent of any table.
  - id: DataEntity
    label: Data entity
    definition: A logical entity in a data model, with a grain and keys.
  - id: DataAsset
    label: Data asset
    definition: A physical artifact such as a table, view or dbt model.
  - id: Attribute
    label: Attribute
    definition: A property of a data entity.
  - id: ModellingStandard
    label: Modelling standard
    definition: An agreed rule for how models are named, structured or documented.
  - id: Decision
    label: Decision
    definition: A reviewed design choice with rationale and scope.
  - id: KnownIssue
    label: Known issue
    definition: >-
      A defect or limitation in data assets, with a lifecycle (open, fixed or
      won't fix). The `valid` range on its `affects` relations says when it
      affected them: give the relation `valid.until` when it is fixed, so the
      issue drops out of current answers and stays queryable for history.

predicates:
  - id: grain
    label: grain
    definition: What one row (or one instance) represents.
    cardinality: one
    range: literal
  - id: owned_by
    label: owned by
    definition: Team or person accountable for the concept or asset.
    cardinality: one
  - id: represents
    label: represents
    definition: A data entity or asset that implements a business concept.
    cardinality: many
    range: BusinessConcept
  - id: has_key
    label: has key
    definition: Attribute (or attribute set) that identifies an instance. Declared, not proven.
    cardinality: many
    range: Attribute
  - id: relates_to
    label: relates to
    definition: A business relationship. Qualify with `cardinality` and `role`; not a foreign key.
    cardinality: many
    range: BusinessConcept
  - id: places
    label: places
    cardinality: many
    range: BusinessConcept
  - id: contains
    label: contains
    cardinality: many
    range: BusinessConcept
  - id: applies_to
    label: applies to
    definition: Scope of a standard or decision.
    cardinality: many

  # Physical structure. OpenDataSuite supplies these for dbt projects (onto-ods);
  # subjects are ODS node ids, columns are `<node id>#<column>`.
  - id: asset_kind
    label: asset kind
    definition: table, view, seed, snapshot or source.
    cardinality: one
    range: literal
  - id: relation
    label: relation
    definition: Fully qualified name to query the asset by.
    cardinality: one
    range: literal
  - id: has_column
    label: has column
    cardinality: many
    range: Attribute
  - id: data_type
    label: data type
    cardinality: one
    range: literal
  - id: primary_key
    label: primary key
    definition: Columns that identify a row. The `basis` qualifier says how ODS knows (declared, tested, joined, inferred).
    cardinality: one
    range: literal
  - id: unique_key
    label: unique key
    cardinality: many
    range: literal
  - id: references
    label: references
    definition: A key relationship between assets (ODS ERD), qualified with columns, cardinality and basis. Not lineage.
    cardinality: many
    range: DataAsset

  # Predicates teams use for business meaning. Declared so proposals can reuse
  # them instead of inventing near-duplicates (#29).
  - id: rule
    label: rule
    definition: >-
      A business rule that applies to the subject, such as a threshold, a filter
      or an exclusion, stated in words. Qualify with `threshold`, `operator` or
      `column` when useful.
    cardinality: many
    range: literal
  - id: known_issue
    label: known issue
    definition: >-
      A free-text note about a defect or limitation of the subject. It has no
      lifecycle; for a defect that will be fixed, record a KnownIssue entity
      that `affects` the subject instead.
    cardinality: many
    range: literal

  # Known issues (KnownIssue entities). Digests and ontology_context list the
  # open ones on the entities they show; fixed ones only when asked.
  - id: affects
    label: affects
    definition: >-
      An asset or column (`<node id>#<column>`) a known issue affects. Its
      `valid` range is when the issue affected it: `from` when it started,
      `until` when it was fixed.
    cardinality: many
    range: DataAsset
  - id: status
    label: status
    definition: "A known issue's state: open, fixed or wont_fix."
    cardinality: one
    range: literal
  - id: ticket
    label: ticket
    definition: The tracker ticket for a known issue, e.g. DATA-412.
    cardinality: one
    range: literal
  - id: since
    label: since
    definition: When a known issue started, as an ISO-8601 day or a release version.
    cardinality: one
    range: literal
  - id: fixed_in
    label: fixed in
    definition: When a known issue was fixed, as an ISO-8601 day or a release version.
    cardinality: one
    range: literal
  - id: workaround
    label: workaround
    definition: How to get correct results while a known issue is open.
    cardinality: one
    range: literal
  - id: measures
    label: measures
    definition: An asset or concept that quantifies a business concept.
    cardinality: many
    range: BusinessConcept
  - id: measured_by
    label: measured by
    definition: The measure that quantifies a business concept (the inverse of `measures`).
    cardinality: many
    range: BusinessConcept
  - id: refines
    label: refines
    definition: A narrower concept, standard or decision that builds on a broader one.
    cardinality: many
  - id: derived_from
    label: derived from
    definition: A concept or measure computed from another.
    cardinality: many
